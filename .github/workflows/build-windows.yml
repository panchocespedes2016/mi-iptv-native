name: build-windows

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Subir version (patch +1)
        id: bump
        shell: pwsh
        run: |
          $v = python scripts/bump_version.py
          "version=$v" >> $env:GITHUB_OUTPUT
          Write-Host "Nueva version: $v"

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Publicar exe portable
        run: dotnet publish src/MiIptv.App/MiIptv.App.csproj -c Release -o publish

      - name: Copiar DLLs nativas de VLC
        shell: pwsh
        run: |
          $pkg = Get-ChildItem "$env:USERPROFILE\.nuget\packages\videolan.libvlc.windows" -Directory |
                 Sort-Object Name -Descending | Select-Object -First 1
          if (-not $pkg) { throw "Paquete videolan.libvlc.windows no encontrado en NuGet" }
          $dst = "publish\libvlc\win-x64"
          New-Item -ItemType Directory -Force -Path $dst | Out-Null
          Copy-Item (Join-Path $pkg.FullName "build\x64\*") -Destination $dst -Recurse -Force

      - name: Ordenar carpeta (DLLs a libs)
        shell: pwsh
        run: |
          # Todo *.dll -> libs\, MENOS lo que el arranque exige al lado del exe:
          # - mi-iptv-native.dll: la busca el exe por nombre
          # - System.Private.CoreLib.dll: se necesita antes de que corra código gestionado
          # - System.Runtime.dll: el runtime la pide antes de que corra StartupHook.Init
          # - hostfxr/hostpolicy/coreclr/clrjit/clrgc/clretwrc: cadena del host nativo
          $keep = @('mi-iptv-native.dll','System.Private.CoreLib.dll','System.Runtime.dll',
                    'hostfxr.dll','hostpolicy.dll','coreclr.dll','clrjit.dll','clrgc.dll','clretwrc.dll')
          $moved = @{}
          New-Item -ItemType Directory -Force -Path "publish\libs" | Out-Null
          Get-ChildItem "publish\*.dll" | ForEach-Object {
            if ($keep -contains $_.Name) { return }
            Move-Item $_.FullName "publish\libs\" -Force
            $moved[$_.Name] = $true
          }
          # Satélites de idioma -> libs\<cultura>\
          Get-ChildItem "publish\" -Directory | Where-Object { $_.Name -notin @('libs','libvlc') } |
            ForEach-Object { Move-Item $_.FullName "publish\libs\" -Force }
          # deps.json: que el runtime busque en libs\
          $depsPath = "publish\mi-iptv-native.deps.json"
          $deps = Get-Content $depsPath -Raw | ConvertFrom-Json
          foreach ($t in $deps.targets.PSObject.Properties) {
            foreach ($l in $t.Value.PSObject.Properties) {
              foreach ($kind in @('runtime','resources')) {
                $assets = $l.Value.$kind
                if (-not $assets) { continue }
                foreach ($a in @($assets.PSObject.Properties.Name)) {
                  if ($moved.ContainsKey([IO.Path]::GetFileName($a))) {
                    $val = $assets.$a
                    $assets.PSObject.Properties.Remove($a)
                    Add-Member -InputObject $assets -NotePropertyName "libs/$a" -NotePropertyValue $val
                  }
                }
              }
            }
          }
          $deps | ConvertTo-Json -Depth 32 | Set-Content $depsPath -Encoding UTF8
          Write-Host "Movidas a libs\: $($moved.Count) DLLs"

      - name: Verificar carpeta portable
        shell: pwsh
        run: |
          $rootFiles = @(Get-ChildItem "publish\*" -File).Count
          $libsDlls = @(Get-ChildItem "publish\libs\*.dll").Count
          Write-Host "Raíz: $rootFiles archivos; libs: $libsDlls DLLs"
          if ($libsDlls -lt 30) { throw "libs\ casi vacío ($libsDlls)" }
          if ($rootFiles -gt 20) { throw "demasiados archivos en raíz ($rootFiles)" }
          if (-not (Test-Path "publish\libvlc\win-x64\libvlc.dll")) { throw "falta libvlc" }
          if (-not (Test-Path "publish\mi-iptv-native.exe")) { throw "falta exe" }

      - name: Zip con numero de version
        shell: pwsh
        run: |
          $v = "${{ steps.bump.outputs.version }}"
          Compress-Archive -Path "publish/*" -DestinationPath "MiIptv-Native-$v-win64.zip" -Force
          Get-ChildItem "MiIptv-Native-$v-win64.zip"

      - uses: actions/upload-artifact@v4
        with:
          name: MiIptv-Native-${{ steps.bump.outputs.version }}-win64
          path: MiIptv-Native-${{ steps.bump.outputs.version }}-win64.zip

      - name: Guardar bump de version [skip ci]
        shell: pwsh
        run: |
          git config user.name "CI"
          git config user.email "ci@local"
          git add src/MiIptv.App/MiIptv.App.csproj src/MiIptv.Core/MiIptv.Core.csproj
          git commit -m "build: version ${{ steps.bump.outputs.version }} [skip ci]"
          git push
